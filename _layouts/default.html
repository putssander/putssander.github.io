<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <header class="site-header">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="site-name" href="{{ '/' | relative_url }}">
        <span class="site-mark" aria-hidden="true">SP</span>
        <span>Sander Puts</span>
      </a>
      <div class="nav-links">
        <a href="{{ '/#actuelly' | relative_url }}">Actuelly</a>
        <a href="{{ '/#projects' | relative_url }}">Research</a>
        <a href="{{ '/#augible' | relative_url }}">Augible</a>
        <a href="{{ '/blog/' | relative_url }}">Notes</a>
      </div>
    </nav>
  </header>

  <main id="content" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-statement">Clinical NLP<br>&amp; human-centred AI.</p>
      <div class="footer-meta">
        <p>Based in the Netherlands</p>
        <p><a href="mailto:putssander@gmail.com">Let’s talk <span aria-hidden="true">↗</span></a></p>
      </div>
      <div class="footer-meta footer-right">
        <p>© {{ 'now' | date: '%Y' }} Sander Puts</p>
        <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
      </div>
    </div>
  </footer>
</body>
</html>
