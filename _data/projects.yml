- name: CEI-trace
  url: https://github.com/putssander/CEI-trace
  tag: Open source & models
  status: Coming soon
  context: Clinical Data Science
  description: >-
    Clinical coding by the official, human-written rulebook with local
    language models. Each hospital's or dataset's conventions sit in their own
    layer, and every code keeps a trace a coder can check. Code, notebooks and
    models for our ICD-10 coding study.

- name: Medmorf
  url: https://medmorf.com
  tag: Web app
  status: Live
  context: Clinical Data Science
  description: >-
    Privacy-first AI processing of medical documents, entirely on-device.
