- name: TrialSchema
  url: https://putssander.github.io/trialschema/
  tag: Web app
  status: Live
  context: Clinical Data Science
  description: >-
    Structure clinical trial criteria for AI-powered patient eligibility
    matching. Import trials from Excel, CSV, or JSON, normalize them for LLMs,
    and review the results — no backend, no telemetry.

- name: Metaphor Discovery
  url: https://putssander.github.io/4dpicture-danish/demo/index.html
  tag: Research demo
  status: Demo
  context: Clinical Data Science
  description: >-
    A human-in-the-loop pipeline for finding the metaphors people use to
    describe illness. Software proposes and ranks candidate expressions;
    researchers and patient advisors decide. Built toward a multilingual
    Metaphor Menu, starting with Danish, as part of the 4D PICTURE project.
