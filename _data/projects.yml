- id: tumorboard-precedents
  name: Tumorboard Precedents
  url: https://sanderputs.com/tumorboard-precedents-demo/
  about_url: https://sanderputs.com/tumorboard-precedents-demo/about.html
  evaluation_url: https://sanderputs.com/tumorboard-precedents-demo/evaluation.html
  tag: Advisory-board preparation
  status: Research demo
  category: clinical
  context: Clinical Data Science
  release_date: "2026-11-06"
  release_label: Demo released
  release_source: "GitHub Pages: first successful deployment, 2026-11-06T17:00:22Z; deployment 7605749756, job 128025615631."
  spotlight: true
  summary: Prepare a cancer-in-pregnancy case with guidelines and comparable earlier decisions.
  description: >-
    A research workspace that structures a request, checks cervical staging against
    cited rules, and compares the case with earlier tumour-board discussions.
    A printable board brief brings together guideline options, supporting quotes
    and unresolved questions. The board writes the advice.
  note: Fictional requests and paraphrased earlier cases. Technical demonstration; not clinically validated.
  link_label: Explore the demo

